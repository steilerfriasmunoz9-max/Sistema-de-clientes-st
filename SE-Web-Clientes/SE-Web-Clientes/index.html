<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&E WEB · Gestión de clientes</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOGIN -->
<main id="login" class="login">
  <form id="loginForm" class="login-box" autocomplete="off">
    <img src="img/logo.png" alt="S&E WEB" class="login-logo">
    <h1>Panel de clientes</h1>
    <p class="muted">Inicia sesión para continuar</p>
    <label>Usuario<input id="u" required autofocus></label>
    <label>Contraseña<input id="p" type="password" required></label>
    <p id="err" class="err" hidden>Usuario o contraseña incorrectos.</p>
    <button class="btn primary wide">Entrar</button>
  </form>
</main>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="img/logo.png" alt=""><span>S&E WEB</span></div>
    <div class="who"><span id="whoName"></span><span id="roleTag" class="tag"></span>
      <button id="logout" class="btn ghost">Cerrar sesión</button></div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats"></section>

    <section class="bar">
      <input id="q" type="search" placeholder="Buscar por nombre, negocio o teléfono">
      <select id="f"><option value="">Todos los estados</option><option>Pendiente</option><option>En proceso</option><option>Entregado</option><option>Cancelado</option></select>
      <div class="admin-only actions">
        <button id="add" class="btn primary">Nuevo cliente</button>
        <button id="csv" class="btn">Exportar CSV</button>
        <button id="bk" class="btn">Respaldo</button>
        <label class="btn">Importar<input id="imp" type="file" accept=".json" hidden></label>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead><tr><th>Cliente</th><th>Tipo de página</th><th>Precio</th><th>Abonado</th><th>Estado</th><th>Entrega</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No hay clientes todavía. Usa “Nuevo cliente” para guardar el primero.</p>
    </section>
  </main>
</div>

<!-- FORMULARIO -->
<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Nuevo cliente</h2>
    <div class="grid">
      <label>Nombre<input name="name" required></label>
      <label>Negocio<input name="business"></label>
      <label>Teléfono / WhatsApp<input name="phone" placeholder="8091234567"></label>
      <label>Tipo de página
        <select name="type"><option>Página informativa</option><option>Tienda online</option><option>Landing page</option><option>Portafolio</option><option>Sistema / App web</option><option>Otro</option></select></label>
      <label>Precio (RD$)<input name="price" type="number" min="0" step="any" value="0"></label>
      <label>Abonado (RD$)<input name="paid" type="number" min="0" step="any" value="0"></label>
      <label>Estado
        <select name="status"><option>Pendiente</option><option>En proceso</option><option>Entregado</option><option>Cancelado</option></select></label>
      <label>Fecha de entrega<input name="due" type="date"></label>
    </div>
    <label>Notas<textarea name="notes" rows="3" placeholder="Qué necesita, colores, dominio, observaciones…"></textarea></label>
    <div class="dlg-actions">
      <button type="button" id="cancel" class="btn">Cancelar</button>
      <button class="btn primary">Guardar cliente</button>
    </div>
  </form>
</dialog>
<div id="toast" class="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
